apiVersion: v1
kind: Service
metadata:
  name: {{ include "rsshub.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rsshub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.source.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "rsshub.selectorLabels" . | nindent 4 }}